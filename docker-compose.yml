services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sololeveling
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sololeveling"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseConnectionString: "Host=postgres;Port=5432;Database=sololeveling;Username=postgres;Password=postgres"
      JwtSecret: "${JwtSecret:-compose-default-secret-change-me-0123456789abcdef}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
