services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sololeveling
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 只綁本機，避免預設帳密的 DB 對外暴露
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sololeveling"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseConnectionString: "Host=postgres;Port=5432;Database=sololeveling;Username=postgres;Password=postgres"
      # 必填：由同目錄的 .env 或主機環境變數提供，範本見 .env.example
      JwtSecret: "${JwtSecret:?請在 .env 設定 JwtSecret（至少 32 字元），範本見 .env.example}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
